<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – Nourish & Hope</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #5C7A5F;
      --green-light: #EBF2EC;
      --green-dark: #3B5E3D;
      --cream: #FAF7F2;
      --text: #2D2D2A;
      --text-secondary: #5A5750;
      --border: #EDE8DF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      justify-content: center;
    }
    .logo img {
      width: 36px;
      height: 36px;
    }
    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--green-dark);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      margin-bottom: 16px;
    }
    .input-wrapper input {
      width: 100%;
      padding: 14px 44px 14px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background: var(--cream);
      outline: none;
      transition: border-color 0.2s;
    }
    .input-wrapper input:focus {
      border-color: var(--green);
    }
    .toggle-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: auto;
      margin: 0;
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1;
    }
    .toggle-btn:hover { opacity: 0.7; }
    button {
      width: 100%;
      padding: 16px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 4px;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      background: #FDECEA;
      border: 1px solid #F5C6C2;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      color: #C0392B;
      margin-bottom: 16px;
      display: none;
    }
    .success {
      background: var(--green-light);
      border: 1px solid #A8C4AA;
      border-radius: 10px;
      padding: 16px;
      font-size: 14px;
      color: var(--green-dark);
      text-align: center;
      line-height: 1.6;
      display: none;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--green);
      font-weight: 600;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="10" fill="#5C7A5F"/>
        <path d="M18 8C18 8 10 14 10 20C10 24.4 13.6 28 18 28C22.4 28 26 24.4 26 20C26 14 18 8 18 8Z" fill="#EBF2EC"/>
        <path d="M18 12C18 12 14 16 14 20C14 22.2 15.8 24 18 24C20.2 24 22 22.2 22 20C22 16 18 12 18 12Z" fill="#5C7A5F"/>
      </svg>
      <span class="logo-text">Nourish & Hope</span>
    </div>

    <div id="form-section">
      <h1>Create new password</h1>
      <p class="subtitle">Enter your new password below. Make sure it's at least 6 characters.</p>

      <div class="error" id="error-msg"></div>

      <label for="password">New password</label>
      <div class="input-wrapper">
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password">
        <button type="button" class="toggle-btn" onclick="togglePassword('password', this)" aria-label="Show password">👁</button>
      </div>

      <label for="confirm-password">Confirm new password</label>
      <div class="input-wrapper">
        <input type="password" id="confirm-password" placeholder="Type your password again" autocomplete="new-password">
        <button type="button" class="toggle-btn" onclick="togglePassword('confirm-password', this)" aria-label="Show password">👁</button>
      </div>

      <button id="save-btn" onclick="handleReset()">Save new password</button>
    </div>

    <div class="success" id="success-msg">
      ✅ Your password has been updated successfully!<br><br>
      You can now go back to the Nourish & Hope app and log in with your new password.
    </div>

    <a href="https://apps.apple.com/us/app/id6775937040" class="back-link">← Back to Nourish & Hope</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://eulgfuusfxcuahmddond.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1bGdmdXVzZnhjdWFobWRkb25kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NDk3MTksImV4cCI6MjA5MTAyNTcxOX0.IcYbfNjG1btJnAtQU8mzKY9-2euKViexr6bnbrNea6I';

    function togglePassword(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }

    function getHashParams() {
      const hash = window.location.hash.substring(1);
      const params = {};
      hash.split('&').forEach(function(part) {
        const item = part.split('=');
        params[decodeURIComponent(item[0])] = decodeURIComponent(item[1] || '');
      });
      return params;
    }

    const params = getHashParams();
    const accessToken = params['access_token'];
    const errorParam = params['error'];
    const errorDescription = params['error_description'];

    if (errorParam) {
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').textContent = 'This reset link has expired or is invalid. Please request a new one from the app.';
      document.getElementById('save-btn').disabled = true;
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error-msg').style.display = 'none';
    }

    async function handleReset() {
      hideError();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (!password || password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }
      if (password !== confirm) {
        showError('Passwords do not match.');
        return;
      }
      if (!accessToken) {
        showError('Invalid reset link. Please request a new one from the app.');
        return;
      }

      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const response = await fetch(SUPABASE_URL + '/auth/v1/user', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + accessToken
          },
          body: JSON.stringify({ password: password })
        });

        const data = await response.json();

        if (response.ok) {
          document.getElementById('form-section').style.display = 'none';
          document.getElementById('success-msg').style.display = 'block';
        } else {
          showError(data.message || 'Something went wrong. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Save new password';
        }
      } catch (err) {
        showError('Network error. Please check your connection and try again.');
        btn.disabled = false;
        btn.textContent = 'Save new password';
      }
    }
  </script>
</body>
</html>
